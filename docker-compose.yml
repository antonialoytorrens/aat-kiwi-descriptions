services:
  ci:
    build:
      context: .
      dockerfile: Dockerfile
      target: ci
    volumes:
      - .:/workspace
    working_dir: /workspace
    env_file:
      - .env
    environment:
      - SONAR_TOKEN
      - SONAR_HOST_URL
      - SONAR_PROJECT_KEY
  aat-kiwi-builder:
    build: .
    image: aat-kiwi-descriptions-builder
    pull_policy: build
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    privileged: true
    volumes:
      - .:/workspace
      - kiwi-cache:/var/cache/kiwi
      # Live host /dev (not a static device list): partition nodes kiwi creates
      # dynamically via losetup (e.g. /dev/loop3p1) must be visible in-container.
      - /dev:/dev
    working_dir: /workspace

volumes:
  kiwi-cache:

