# Repository settings

# Board Support Packaging, for device tweaks
BSP_REPO = git@gitlab.com:aat-debian-repository/bsp.git
BSP_BRANCH = main

# Distributions and their permitted releases: distro:release,release,... (first release = default)
RELEASES := \
	debian:13,12 \
	alpine:v3.24 \
	pmos:v26.06

# Build configuration
DEFAULT_TIER    = server
SUPPORTED_TIERS = server workstation

# Locale / keyboard / timezone defaults (Debian images)
LOCALE   = ca_ES
TIMEZONE = Europe/Madrid
KEYTABLE = es

# Default account created in the image (Debian images)
USERNAME = linux
PASSWORD = changeme

# Hostname set inside the image (defaults to the distribution name)
HOSTNAME = $(DISTRO)
